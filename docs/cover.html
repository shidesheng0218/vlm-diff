<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLM-Diff 文章封面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .cover {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* 背景装饰 */
    .cover::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .cover::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -15%;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .content {
      z-index: 1;
      text-align: center;
      padding: 60px;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 8px 20px;
      border-radius: 20px;
      color: white;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    h1 {
      color: white;
      font-size: 64px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 24px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .highlight {
      color: #ffd700;
      display: block;
      font-size: 72px;
      margin-top: 12px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.95);
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 40px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .stats {
      display: flex;
      gap: 40px;
      justify-content: center;
      margin-top: 40px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 20px 32px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .stat-value {
      color: #ffd700;
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-label {
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      font-weight: 500;
    }

    .tech-stack {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 1;
    }

    .tech-tag {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="content">
      <div class="badge">🚀 开源项目</div>
      <h1>
        用 VLM + DOM Diff
        <span class="highlight">做 UI 自动化测试</span>
      </h1>
      <p class="subtitle">比纯视觉模型准确率提升 30%+ · Token 成本降低 87%</p>

      <div class="stats">
        <div class="stat-item">
          <div class="stat-value">97%</div>
          <div class="stat-label">召回率</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">95%</div>
          <div class="stat-label">准确率</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">-87%</div>
          <div class="stat-label">成本</div>
        </div>
      </div>
    </div>

    <div class="tech-stack">
      <span class="tech-tag">TypeScript</span>
      <span class="tech-tag">Claude Opus</span>
      <span class="tech-tag">GPT-5</span>
      <span class="tech-tag">DOM Diff</span>
      <span class="tech-tag">Playwright</span>
    </div>
  </div>
</body>
</html>
