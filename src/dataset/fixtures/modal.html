<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, sans-serif; background: #f4f5f7; margin: 0; }
  .page { padding: 40px; color: #6b7280; font-size: 14px; }
  .overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, 0.45); display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); width: 380px; padding: 24px; }
  .modal h2 { margin: 0 0 6px; font-size: 17px; color: #111827; }
  .modal p { margin: 0 0 20px; font-size: 13px; color: #6b7280; line-height: 1.5; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn-ghost { padding: 8px 16px; background: #fff; color: #374151; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .btn-primary { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
  <div class="page">Dashboard content behind the modal.</div>
  <div class="overlay" id="overlay">
    <div class="modal" id="modal">
      <h2 id="modal-title">Delete project?</h2>
      <p id="modal-body">This will permanently remove the project and its 14 deployments. This action cannot be undone.</p>
      <div class="actions" id="modal-actions">
        <button class="btn-ghost" id="btn-cancel">Cancel</button>
        <button class="btn-primary" id="btn-confirm">Confirm</button>
      </div>
    </div>
  </div>
</body>
</html>
